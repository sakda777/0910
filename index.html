<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>我的音乐列表</title>
<style>
  :root {
    --accent: #6ee7b7;
    --glass: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.22);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0b0b0f;
  }

  /* ===== 背景图 ===== */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image: url("https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80");
    background-size: cover;
    background-position: center;
    /* 图片加载不出来时的兜底底色 */
    background-color: #1b1b2b;
  }
  /* 背景上的暗色遮罩，让文字看得清 */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(8, 10, 25, 0.5), rgba(8, 10, 25, 0.85));
  }

  /* ===== 玻璃卡片 ===== */
  .player {
    width: min(600px, 100%);
    max-height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 26px;
    border-radius: 24px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    user-select: none;
    animation: rise 0.6s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ===== 当前播放信息 ===== */
  .now { display: flex; align-items: center; gap: 14px; }

  .disc {
    width: 56px;
    height: 56px;
    flex: 0 0 auto;
    border-radius: 50%;
    position: relative;
    display: grid;
    place-items: center;
    background:
      repeating-radial-gradient(circle at 50% 50%,
        rgba(255, 255, 255, 0.06) 0 2px, transparent 2px 6px),
      linear-gradient(140deg, #1b1b22, #3a3a46);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  .disc::after {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .disc.spin { animation: spin 5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta { flex: 1; min-width: 0; }
  .meta h1 {
    font-size: 17px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta p {
    margin-top: 4px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== 进度条 ===== */
  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    font-variant-numeric: tabular-nums;
  }
  .progress {
    flex: 1;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    cursor: pointer;
    touch-action: none;
    position: relative;
  }
  .progress .fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #6ee7b7, #34d399);
    position: relative;
  }
  .progress .fill::after {
    content: "";
    position: absolute;
    right: -5px;
    top: 50%;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    transform: translateY(-50%) scale(0);
    transition: transform 0.15s;
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
  }
  .progress:hover .fill::after { transform: translateY(-50%) scale(1); }

  /* ===== 控制按钮 ===== */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  button {
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.15s, background 0.2s, opacity 0.2s;
  }
  button:active { transform: scale(0.94); }

  .ctrl {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    opacity: 0.85;
  }
  .ctrl:hover { opacity: 1; background: rgba(255, 255, 255, 0.12); }
  .ctrl svg { width: 20px; height: 20px; }

  .play-main {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(140deg, #6ee7b7, #34d399);
    color: #062b1f;
    box-shadow: 0 8px 24px rgba(52, 211, 153, 0.4);
  }
  .play-main:hover { transform: scale(1.06); }
  .play-main svg { width: 26px; height: 26px; }

  /* ===== 播放列表 ===== */
  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
  }

  .playlist {
    list-style: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-right: 6px;
  }
  .playlist::-webkit-scrollbar { width: 6px; }
  .playlist::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
  }

  .song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .song:hover { background: rgba(255, 255, 255, 0.1); }
  .song.active { background: rgba(110, 231, 183, 0.16); }

  .song .num {
    width: 20px;
    flex: 0 0 20px;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
    font-variant-numeric: tabular-nums;
  }
  .song.active .num { color: var(--accent); }

  .song .info { flex: 1; min-width: 0; }
  .song .info .t {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song.active .info .t { color: var(--accent); }
  .song .info .a {
    margin-top: 2px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 暂停时的小三角 */
  .dot {
    display: block;
    width: 0;
    height: 0;
    border-left: 7px solid var(--accent);
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }

  /* 播放中的跳动音柱 */
  .eq {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    height: 14px;
  }
  .eq i {
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    transform-origin: bottom;
    animation: eq 0.9s ease-in-out infinite;
  }
  .eq i:nth-child(1) { height: 7px;  animation-delay: 0s; }
  .eq i:nth-child(2) { height: 13px; animation-delay: 0.2s; }
  .eq i:nth-child(3) { height: 9px;  animation-delay: 0.4s; }
  @keyframes eq {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }

  /* ===== 提示条 ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translate(-50%, 20px);
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(10px);
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 手机适配 ===== */
  @media (max-width: 480px) {
    body { padding: 12px; }
    .player { padding: 20px 16px; border-radius: 20px; gap: 14px; }
    .disc { width: 48px; height: 48px; }
    .play-main { width: 52px; height: 52px; }
    .controls { gap: 10px; }
  }
</style>
</head>
<body>

  <!-- 背景图 -->
  <div class="bg"></div>

  <main class="player">

    <!-- 当前播放 -->
    <section class="now">
      <div class="disc" id="disc"></div>
      <div class="meta">
        <h1 id="title">未选择歌曲</h1>
        <p id="artist">点击下方列表开始播放</p>
      </div>
    </section>

    <!-- 进度条 -->
    <section class="bar-row">
      <span id="curTime">0:00</span>
      <div class="progress" id="progress"><div class="fill" id="fill"></div></div>
      <span id="durTime">0:00</span>
    </section>

    <!-- 控制按钮 -->
    <section class="controls">
      <button class="ctrl" id="modeBtn" title="播放模式"></button>
      <button class="ctrl" id="prevBtn" title="上一首">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm12 0v12l-8.5-6z"/></svg>
      </button>
      <button class="play-main" id="playBtn" title="播放 / 暂停"></button>
      <button class="ctrl" id="nextBtn" title="下一首">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button class="ctrl" id="volBtn" title="静音">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
    </section>

    <!-- 播放列表 -->
    <section class="list-head">
      <span>播放列表</span>
      <span id="count">0 首</span>
    </section>
    <ul class="playlist" id="playlist"></ul>

  </main>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 歌曲数据 —— 把 title / artist / src 换成你自己的即可
   src 支持：网络地址 或 本地相对路径（如 "music/song1.mp3"）
   ========================================================= */
const songs = [
  { title: '神秘优美',  artist: 'Demo Artist', src: 'http://wx.welangdu.com/ReadWeb/ImagesUser/backAudio/BackAudio_23388_2205131039.mp3' },
  { title: '优美大气',  artist: 'Demo Artist', src: 'http://wx.welangdu.com/ReadWeb/ImagesUser/backAudio/BackAudio_23389_2205131039.mp3' },
  { title: '海边散步',  artist: 'Demo Artist', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
  { title: '清晨咖啡',  artist: 'Demo Artist', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
  { title: '星空列车',  artist: 'Demo Artist', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' },
];

/* ===== 图标 ===== */
const ICONS = {
  play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  repeat:    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>',
  repeatOne: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>',
  shuffle:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>',
  volume:    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
  volumeOff: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>',
};

const MODES = [
  { key: 'list',    icon: ICONS.repeat,    label: '列表循环' },
  { key: 'single',  icon: ICONS.repeatOne, label: '单曲循环' },
  { key: 'shuffle', icon: ICONS.shuffle,   label: '随机播放' },
];

/* ===== DOM ===== */
const $ = id => document.getElementById(id);
const playlistEl = $('playlist');
const titleEl    = $('title');
const artistEl   = $('artist');
const curTimeEl  = $('curTime');
const durTimeEl  = $('durTime');
const fillEl     = $('fill');
const progressEl = $('progress');
const playBtn    = $('playBtn');
const prevBtn    = $('prevBtn');
const nextBtn    = $('nextBtn');
const modeBtn    = $('modeBtn');
const volBtn     = $('volBtn');
const discEl     = $('disc');
const countEl    = $('count');
const toastEl    = $('toast');

/* ===== 状态 ===== */
const audio = new Audio();
audio.preload = 'metadata';

let currentIndex = 0;      // 当前歌曲下标
let loaded       = false;  // 是否已经绑定过音频
let isPlaying    = false;
let dragging     = false;
let modeIndex    = 0;
let mode         = 'list';

/* ===== 工具 ===== */
const fmt = t => {
  if (!isFinite(t) || t < 0) return '0:00';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
};

let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
}

/* ===== 渲染列表 ===== */
function buildList() {
  playlistEl.innerHTML = '';
  songs.forEach((song, i) => {
    const li = document.createElement('li');
    li.className = 'song';
    li.innerHTML = `
      <span class="num">${i + 1}</span>
      <div class="info">
        <div class="t">${song.title}</div>
        <div class="a">${song.artist}</div>
      </div>
    `;
    li.addEventListener('click', () => {
      if (i === currentIndex && loaded) togglePlay();
      else playSong(i);
    });
    playlistEl.appendChild(li);
  });
  countEl.textContent = songs.length + ' 首';
  highlight();
}

/* 高亮当前歌曲 */
function highlight() {
  [...playlistEl.children].forEach((li, i) => {
    const num = li.querySelector('.num');
    if (i === currentIndex) {
      li.classList.add('active');
      num.innerHTML = isPlaying
        ? '<span class="eq"><i></i><i></i><i></i></span>'
        : '<span class="dot"></span>';
    } else {
      li.classList.remove('active');
      num.textContent = i + 1;
    }
  });
}

/* ===== 播放指定歌曲 ===== */
function playSong(i) {
  if (i < 0 || i >= songs.length) return;
  currentIndex = i;
  loaded = true;

  const song = songs[i];
  audio.src = song.src;
  titleEl.textContent = song.title;
  artistEl.textContent = song.artist;
  document.title = song.title + ' · ' + song.artist;

  fillEl.style.width = '0%';
  curTimeEl.textContent = '0:00';
  durTimeEl.textContent = '0:00';

  audio.play().catch(err => {
    console.warn('播放失败：', err);
    toast('播放失败，请检查音频地址');
  });

  highlight();
}

/* ===== 播放 / 暂停 ===== */
function togglePlay() {
  if (!loaded) { playSong(currentIndex); return; }
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}

/* ===== 下一首 ===== */
function next(auto = false) {
  // 单曲循环：自动结束时重播
  if (mode === 'single' && auto) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  let i;
  if (mode === 'shuffle' && songs.length > 1) {
    do { i = Math.floor(Math.random() * songs.length); } while (i === currentIndex);
  } else {
    i = (currentIndex + 1) % songs.length;
  }
  playSong(i);
}

/* ===== 上一首 ===== */
function prev() {
  if (loaded && audio.currentTime > 3) {   // 播放超过 3 秒则回到开头
    audio.currentTime = 0;
    return;
  }
  let i;
  if (mode === 'shuffle' && songs.length > 1) {
    do { i = Math.floor(Math.random() * songs.length); } while (i === currentIndex);
  } else {
    i = (currentIndex - 1 + songs.length) % songs.length;
  }
  playSong(i);
}

/* ===== 进度条拖动 ===== */
function seek(e) {
  const rect = progressEl.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  if (loaded && isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = ratio * audio.duration;
    fillEl.style.width = (ratio * 100) + '%';
    curTimeEl.textContent = fmt(audio.currentTime);
  }
}
progressEl.addEventListener('pointerdown', e => {
  dragging = true;
  progressEl.setPointerCapture(e.pointerId);
  seek(e);
});
progressEl.addEventListener('pointermove', e => { if (dragging) seek(e); });
progressEl.addEventListener('pointerup',     () => { dragging = false; });
progressEl.addEventListener('pointercancel', () => { dragging = false; });

/* ===== 音频事件 ===== */
audio.addEventListener('play', () => {
  isPlaying = true;
  playBtn.innerHTML = ICONS.pause;
  discEl.classList.add('spin');
  highlight();
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  playBtn.innerHTML = ICONS.play;
  discEl.classList.remove('spin');
  highlight();
});

audio.addEventListener('loadedmetadata', () => {
  durTimeEl.textContent = fmt(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (dragging) return;
  const d = audio.duration;
  if (!isFinite(d) || d === 0) return;
  fillEl.style.width = (audio.currentTime / d * 100) + '%';
  curTimeEl.textContent = fmt(audio.currentTime);
});

audio.addEventListener('ended', () => next(true));

audio.addEventListener('error', () => {
  if (loaded) toast('音频加载失败，请检查地址');
});

/* ===== 按钮事件 ===== */
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', () => next(false));
prevBtn.addEventListener('click', prev);

modeBtn.addEventListener('click', () => {
  modeIndex = (modeIndex + 1) % MODES.length;
  mode = MODES[modeIndex].key;
  modeBtn.innerHTML = MODES[modeIndex].icon;
  modeBtn.title = MODES[modeIndex].label;
  toast(MODES[modeIndex].label);
});

volBtn.addEventListener('click', () => {
  audio.muted = !audio.muted;
  volBtn.innerHTML = audio.muted ? ICONS.volumeOff : ICONS.volume;
  toast(audio.muted ? '已静音' : '已取消静音');
});

/* 键盘快捷键：空格播放/暂停，左右方向键切歌 */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') next(false);
  if (e.code === 'ArrowLeft')  prev();
});

/* ===== 初始化 ===== */
buildList();
playBtn.innerHTML = ICONS.play;
modeBtn.innerHTML = MODES[0].icon;
modeBtn.title = MODES[0].label;
titleEl.textContent = songs[0] ? songs[0].title : '暂无歌曲';
artistEl.textContent = songs[0] ? songs[0].artist : '';
</script>
</body>
</html>
